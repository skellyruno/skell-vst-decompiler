name: Python static-analysis tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('protected-{0}-{1}', github.ref, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install audio analysis dependencies
        run: python -m pip install "numpy>=1.26,<3" "scipy>=1.13,<2" "soundfile>=0.12,<1" "pedalboard==0.9.23"
      - name: Install C++ PE fixture compiler and linker
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang lld llvm binutils
          command -v clang++
          command -v lld-link
      - name: Unit tests (no vendor binaries)
        run: python -m unittest discover -s tests -v
      - name: Real GNU and LLVM comparison on owned fixture
        run: PYTHONPATH=. python tests/engine_smoke.py
      - name: Persistent external-engine cache and bounded parallel smoke
        run: PYTHONPATH=. python tests/engine_batch_smoke.py
      - name: Large owned DSP fixture and dependency-tracked cache budget
        run: PYTHONPATH=. python tests/large_engine_smoke.py
      - name: Independent pitch and saturation numerical benchmark
        run: PYTHONPATH=. python tests/dsp_reference_smoke.py
      - name: Historical public pitch-method comparison
        run: PYTHONPATH=. python tests/historical_pitch_smoke.py
      - name: Independent behavioral model and moving pitch comparison
        run: PYTHONPATH=. python tests/behavior_models_smoke.py
      - name: Stereo topology, harmonics and sustained retune probes
        run: PYTHONPATH=. python tests/public_behavior_smoke.py
      - name: Advanced independent DSP hypothesis benchmark
        run: PYTHONPATH=. python tests/advanced_dsp_smoke.py
      - name: Adaptive oscillator and conservative recovery benchmark
        run: PYTHONPATH=. python tests/adaptive_research_smoke.py
      - name: Research gates and competing recovery descriptions
        run: PYTHONPATH=. python tests/research_gates_smoke.py
      - name: Slow motion discrimination and periodic coloration comparison
        env:
          OPENBLAS_NUM_THREADS: '1'
        run: PYTHONPATH=. python tests/motion_color_smoke.py
      - name: Cross-disassembler instruction census on owned PE fixtures
        run: PYTHONPATH=. python tests/code_census_smoke.py
      - name: Bounded static flow verification on owned PE fixtures
        run: PYTHONPATH=. python tests/static_flow_smoke.py
      - name: Context sensitivity and exact decoder alias checks on owned PE fixtures
        run: PYTHONPATH=. python tests/context_flow_smoke.py
      - name: Relocation-backed legacy import evidence on owned PE fixture
        run: PYTHONPATH=. python tests/legacy_math_smoke.py
      - name: Executable extent union coverage on owned PE fixtures
        run: PYTHONPATH=. python tests/extent_coverage_smoke.py
      - name: Actual independent native compressor system identification
        env:
          OPENBLAS_NUM_THREADS: '1'
        run: |
          PYTHONPATH=. python tests/system_id_native_smoke.py
      - name: Automated fresh-process native capture matrix
        env:
          OPENBLAS_NUM_THREADS: '1'
        run: PYTHONPATH=. python tests/host_capture_smoke.py
      - name: Seeded multi-rate automated capture regression
        env:
          OPENBLAS_NUM_THREADS: '1'
        run: PYTHONPATH=. python tests/host_matrix_extended_smoke.py
      - name: Native delay impulse timing and state reset
        run: PYTHONPATH=. python tests/impulse_native_smoke.py
      - name: Original owned delay fixture native and sanitizer tests
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror experiments/host_fixture/test_delay_fixture.cpp -o /tmp/skell_delay_fixture
          /tmp/skell_delay_fixture
          g++ -std=c++17 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer experiments/host_fixture/test_delay_fixture.cpp -o /tmp/skell_delay_fixture_san
          /tmp/skell_delay_fixture_san
      - name: Compile all research Python
        run: python -m compileall -q skell_vst_decompiler
      - name: Compile and test original native DSP prototypes
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror experiments/skelliere/test_original.cpp -o /tmp/skell_original_tests
          /tmp/skell_original_tests
          g++ -std=c++17 -O2 -Wall -Wextra -Werror experiments/skelliere/render.cpp -o /tmp/skell_original_render
      - name: Address and undefined behavior sanitizers
        run: |
          g++ -std=c++17 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer experiments/skelliere/test_original.cpp -o /tmp/skell_original_sanitized
          /tmp/skell_original_sanitized
      - name: Original spatial prototype regression and sanitizers
        run: |
          g++ -std=c++17 -O3 -Wall -Wextra -Werror experiments/skelliere/test_space.cpp -o /tmp/skell_space_tests
          /tmp/skell_space_tests
          g++ -std=c++17 -O3 -Wall -Wextra -Werror experiments/skelliere/render_space.cpp -o /tmp/skell_space_render
          g++ -std=c++17 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer experiments/skelliere/test_space.cpp -o /tmp/skell_space_sanitized
          /tmp/skell_space_sanitized
      - name: Original adaptive compressor experiment and sanitizers
        run: |
          g++ -std=c++17 -O3 -Wall -Wextra -Werror experiments/skelliere/test_adaptive.cpp -o /tmp/skell_adaptive
          /tmp/skell_adaptive
          g++ -std=c++17 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer experiments/skelliere/test_adaptive.cpp -o /tmp/skell_adaptive_sanitized
          /tmp/skell_adaptive_sanitized

      - name: Original stacked flanger reference regression and sanitizers
        run: |
          g++ -std=c++17 -O3 -Wall -Wextra -Werror experiments/flangus_reference/test_stacked.cpp -o /tmp/skell_stacked_flanger
          /tmp/skell_stacked_flanger
          g++ -std=c++17 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer experiments/flangus_reference/test_stacked.cpp -o /tmp/skell_stacked_flanger_sanitized
          /tmp/skell_stacked_flanger_sanitized

      - name: Independent wet duck recovery regression
        run: |
          g++ -std=c++17 -O3 -Wall -Wextra -Werror -Iexperiments/skelliere experiments/skelliere/test_wet_duck.cpp -o /tmp/skell_wet_duck
          /tmp/skell_wet_duck
          g++ -std=c++17 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -Iexperiments/skelliere experiments/skelliere/test_wet_duck.cpp -o /tmp/skell_wet_duck_san
          /tmp/skell_wet_duck_san

      - name: Peak-memory duck regression and full FDN comparison harness
        run: |
          g++ -std=c++17 -O3 -Wall -Wextra -Werror -Iexperiments/skelliere experiments/skelliere/test_peak_duck.cpp -o /tmp/skell_peak_duck
          /tmp/skell_peak_duck
          g++ -std=c++17 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -Iexperiments/skelliere experiments/skelliere/test_peak_duck.cpp -o /tmp/skell_peak_duck_san
          /tmp/skell_peak_duck_san
          g++ -std=c++17 -O3 -Wall -Wextra -Werror -Iexperiments/skelliere experiments/skelliere/space_duck_compare.cpp -o /tmp/skell_space_compare

  windows-owned-vst3-host:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          architecture: x64
      - name: Install host dependencies
        run: python -m pip install "numpy>=1.26,<3" "scipy>=1.13,<2" "soundfile>=0.12,<1" "pedalboard==0.9.23"
      - name: Fetch verified JUCE source
        shell: pwsh
        run: |
          git clone --depth 1 --branch 8.0.12 https://github.com/juce-framework/JUCE.git "$env:RUNNER_TEMP/JUCE"
          if ($LASTEXITCODE -ne 0) { throw "JUCE clone failed" }
          $sha = git -C "$env:RUNNER_TEMP/JUCE" rev-parse HEAD
          if ($sha -ne "29396c22c93392d6738e021b83196283d6e4d850") { throw "JUCE fingerprint mismatch" }
      - name: Build original owned test VST3
        shell: pwsh
        run: |
          cmake -S experiments/host_fixture -B "$env:RUNNER_TEMP/skell-host-build" -A x64 "-DJUCE_DIR=$env:RUNNER_TEMP/JUCE"
          if ($LASTEXITCODE -ne 0) { throw "Configure failed" }
          cmake --build "$env:RUNNER_TEMP/skell-host-build" --config Release --target SkellHostFixture_VST3 --parallel 2
          if ($LASTEXITCODE -ne 0) { throw "Build failed" }
      - name: Load only the owned fixture and verify gain and creative delay renders
        shell: pwsh
        run: |
          $plugin = "$env:RUNNER_TEMP/skell-host-build/SkellHostFixture_artefacts/Release/VST3/Skell Host Fixture.vst3"
          if (!(Test-Path $plugin)) { throw "Owned VST3 output missing" }
          $env:PYTHONPATH = "."
          python tests/host_vst3_smoke.py $plugin
          if ($LASTEXITCODE -ne 0) { throw "Host smoke failed" }
