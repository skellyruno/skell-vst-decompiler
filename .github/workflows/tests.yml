          /tmp/skell_adaptive_native
          g++ -std=c++17 -O1 -g -UNDEBUG -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer -no-pie tests/test_adaptive_native.cpp -o /tmp/skell_adaptive_native_san
