          /tmp/skell_leveler_attack
          g++ -std=c++17 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -no-pie -Wall -Wextra -Werror tests/test_leveler_single_attack.cpp -o /tmp/skell_leveler_attack_san
          /tmp/skell_leveler_attack_san

      - name: Independent crest-hold and residual color regression
        run: |
